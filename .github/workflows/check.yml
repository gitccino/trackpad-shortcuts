name: Check
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: Trackpad-Shortcuts
          path: build/Trackpad Shortcuts.app
